# Pinned toolchain for Terminal Commander.
#
# SPEC.md / docs/research/_USER_DECISIONS.md declare the MSRV floor
# as 1.92.0 (the toolchain used by rmcp =1.8.0).
#
# Amendment 2026-11-23: raise the active toolchain to 1.100.0 to match
# SymForge v12.0.1 and satisfy monty 1.6.0's 1.98+ MSRV floor for
# terminal-commander-codemode. Core crates retain their 1.92 MSRV floor.
#
# Amendment 2026-11-04: raise the active toolchain to 1.99.1, the latest stable.
# This does not change the supported MSRV.
#
# Pin reality (corrected 2026-06-02): 1.92.0 is the DOCUMENTED MSRV
# floor only — it is NOT CI-enforced (no `cargo-hack --rust-version`
# gate exists in any workflow). The channel below (1.100.0) is the
# active dev/CI pin, tied to npm-binary-build.yml's RUST_TOOLCHAIN by
# scripts/linux-gate.sh so the two pins cannot silently drift.

[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
