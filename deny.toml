# cargo-deny configuration for Terminal Commander.
#
# Authoritative scope reference: CONTRIBUTING.md sections 4 and 6.
# Project license: PolyForm-Noncommercial-1.0.0 (see LICENSE). The allow
# list below covers BOTH our own crates' license and the dependency closure.

[graph]
all-features = true

[licenses]
# Allow the set of licenses present in our dependency closure and in
# our own crates. The Terminal Commander crates are
# PolyForm-Noncommercial-1.0.0 (project license). CC0-1.0 is required
# because `notify` core ships under CC0; `notify-debouncer-full` and
# `file-id` are MIT OR Apache-2.0; rmcp is MIT OR Apache-2.0 / Apache-2.0.
allow = [
    "PolyForm-Noncommercial-1.0.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# crates/cli is publish = false; its internal path deps carry no version pin. Registry
# wildcards stay denied, and publishable crates must still pin path deps.
allow-wildcard-paths = true
highlight = "all"
deny = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "store DB is daemon-owned in the user's state dir; no less-trusted writer of db/-wal. Bump tracked in #286" },
  { id = "RUSTSEC-2026-0457", reason = "rmcp OAuth client not compiled (features server,macros,transport-io; no oauth2/reqwest in lock). Bump tracked in #286" },
  { id = "RUSTSEC-2026-0461", reason = "Streamable HTTP server transport not compiled; TC serves stdio only. Bump tracked in #286" },
  { id = "RUSTSEC-2026-0462", reason = "Streamable HTTP clients not compiled (no reqwest/hyper in lock). Bump tracked in #286" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
