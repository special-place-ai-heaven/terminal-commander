[package]
name = "terminal-commander-store"
description = "Persistent store (SQLite) for Terminal Commander daemon state."
readme = "README.md"
keywords = ["terminal-commander", "mcp"]
categories = ["development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
regex = "1.13.1"
# Migrations run manually in lib.rs via execute_batch() (refinery is not
# a dependency). 0.40's breaking changes are virtual-table only.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal-commander-core.workspace = true
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }

[dev-dependencies]
indexmap = { version = "2", features = ["serde"] }

[lints]
workspace = true
