[package]
name = "terminal-commanderd"
description = "Long-running Terminal Commander daemon. Owns bucket manager, context spool, policy engine, audit emitter, and local API."
readme = "README.md"
keywords = ["terminal-commander", "mcp", "daemon"]
categories = ["development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "terminal-commanderd"
path = "src/main.rs"

[[test]]
name = "pipe_peer_identity"
path = "tests/pipe_peer_identity.rs"
required-features = ["test-util"]

[dependencies]
parking_lot = "0.12.5"
time = "0.3"
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "signal", "macros", "net", "io-util"] }
terminal-commander-core.workspace = true
terminal-commander-sifters.workspace = true
terminal-commander-probes.workspace = true
terminal-commander-store.workspace = true
terminal-commander-ipc.workspace = true
terminal-commander-supervisor = { path = "../supervisor", version = "0.3.8" } # x-release-please-version
uuid = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
# Already a production dependency of sibling workspace crates (core, sifters,
# store) and present in Cargo.lock; declared here so the policy engine can
# compile profile path-globs to anchored regexes once at construction. Adds
# no new crate to the build graph.
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# macOS has no /proc: the recipe admin gate reads the peer image
# (proc_pidpath) and parent pid (proc_pidinfo) from libproc. Already in
# Cargo.lock via sibling crates.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
test-util = []

# Replicate workspace lints rather than using `workspace = true` so
# that we can allow `unsafe_code` for the Win32 peer-identity module
# (peer_windows.rs), which must call unsafe Win32 FFI functions.
# All other workspace lints are preserved verbatim.
[lints.rust]
unsafe_code = "allow"          # Win32 FFI in peer_windows.rs
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
significant_drop_tightening = "allow"

[dev-dependencies]
tempfile = "3"
# Fault injection only (a trigger that fails one recipe activation); the
# store already locks this version.
rusqlite = { version = "0.40.2", features = ["bundled"] }
