[package]
name = "terminal-commander-ipc"
description = "Terminal Commander IPC wire protocol, length-prefixed JSON framing, and the cross-platform DaemonClient transport (UDS on Unix, named pipe on Windows)."
readme = "README.md"
keywords = ["terminal-commander", "mcp", "ipc", "daemon"]
categories = ["development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "terminal_commander_ipc"
path = "src/lib.rs"

[dependencies]
terminal-commander-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Replicate workspace lints so `server_identity` can call geteuid / the
# Win32 token APIs (the only unsafe in this crate). All other lint
# settings match the workspace.
[lints.rust]
unsafe_code = "allow"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
significant_drop_tightening = "allow"
